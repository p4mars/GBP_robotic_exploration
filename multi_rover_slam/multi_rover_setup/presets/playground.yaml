rovers:
  - type: leo_rover
  - type: leo_rover
  - type: leo_rover
  - type: leo_rover
  - type: leo_rover

terrain:
  kind: moon_surface
  size_m: 48.0
  texture_px: 8192 #4096
  lod: high
  patch_size_m: null
  augment: none

layout:
  kind: ring # LAYOUT_KINDS = ("ring", "line", "grid", "random", "explicit")
  spacing_m: 1.5
  heading: tangent # HEADINGS = ("chain", "tangent", "center", "random")
  positions: null
  spawn_clearance_m: 0.5

motion:
  kind: orbit # MOTION_KINDS = ("follow", "orbit", "wander", "constant", "idle")
  speed_mps: 0.25
  cmd: [0.2, 0.0]

cameras:
  resolution: [640, 480]
  hfov_deg: 120.0
  depth_format: png16

overseer:
  mode: track #fixed
  resolution: [1280, 720] #[1920, 1080]
  distance_m: 0.01
  height_m: 12.0 #null
  azimuth_deg: -90.0
  focal_length: 10.0 #18.0
  orbit_deg_per_s: 0.0 #6.0

sim:
  steps: 6000
  settle_steps: 60
  warmup_steps: 8
  seed: 0
  headless: true
  quality: performance
  skydome: high_res
  sun_rpy: [45.0, 30.0, 0.0]
  kit_args: ""

output:
  root: multi_rover_slam/out/multi_rover_setup
  name: null              # replaces the descriptive part of the run folder name
  record_every: 2         # agent steps between saved frames (5 -> 5 Hz)
  video: true
  snapshot_only: false
